version: '3.8'

services:
  app:
    build: .
    container_name: daily-tech-news-agent
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      JAVA_OPTS: "-Xmx512m -Xms256m"

      # LLM Configuration (set your API keys here)
      LLM_PROVIDER: groq
      LLM_API_KEY: ${LLM_API_KEY:-your-api-key-here}
      LLM_MODEL: mixtral-8x7b-32768

      # Logging
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_COM_TECHAGENT: DEBUG

    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

    networks:
      - tech-news-network

networks:
  tech-news-network:
    driver: bridge

