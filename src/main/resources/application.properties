# Server
server.port=8080

# ─────────────────────────────────────────────────────────────────
# LLM Provider Configuration (choose one)
# ─────────────────────────────────────────────────────────────────

# OPTION 1: Groq API (RECOMMENDED - 500+ free requests/day)
#   Get FREE key: https://console.groq.com
#   No credit card needed!
llm.provider=groq
llm.api.key=YOUR_GROQ_API_KEY_HERE
llm.model=llama-3.1-8b-instant

# OPTION 2: Google Gemini (quota exhausted for demo key)
# llm.provider=gemini
# llm.api.key=your-gemini-api-key-here
# llm.model=models/gemini-2.0-flash

# OPTION 3: OpenAI (requires paid subscription)
# llm.provider=openai
# llm.api.key=sk-your-openai-key-here
# llm.model=gpt-4-mini

# News Settings
news.hours.lookback=24
news.top.count=10

# Logging
logging.level.com.techagent=INFO
