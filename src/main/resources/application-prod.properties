# ============================================
# Production Configuration
# Use: java -jar app.jar --spring.profiles.active=prod
# ============================================

# Server & Servlet
server.port=8080
server.servlet.context-path=/
server.error.include-message=always
server.error.include-stacktrace=on-param
server.compression.enabled=true
server.compression.min-response-size=1024

# Logging - Less verbose in production
logging.level.root=WARN
logging.level.com.techagent=INFO
logging.level.org.springframework.boot=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Application Info
app.name=Daily Tech News AI Agent
app.version=1.0.0
app.description=AI-powered news aggregation and summarization

# LLM Configuration - Use environment variables in production!
llm.provider=${LLM_PROVIDER:groq}
llm.api.key=${LLM_API_KEY:}
llm.model=${LLM_MODEL:mixtral-8x7b-32768}

# Default behavior if no LLM configured
llm.enable-fallback=true

# RSS Feed Configuration
news.hours.lookback=24
news.max-items=100
news.category.diversity=2
news.similarity.threshold=0.6

# Actuator (Monitoring & Health)
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.metrics.export.prometheus.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true

# Performance
server.tomcat.threads.max=100
server.tomcat.threads.min-spare=10
server.tomcat.max-connections=500
server.tomcat.accept-count=50

# Jackson JSON Serialization
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.serialization.indent-output=false
spring.jackson.default-property-inclusion=non_null

# Caching (if Redis is added)
# spring.cache.type=redis
# spring.redis.host=${REDIS_HOST:localhost}
# spring.redis.port=${REDIS_PORT:6379}
# spring.redis.timeout=2000ms

# Thymeleaf (for future web UI enhancements)
spring.thymeleaf.cache=true
spring.thymeleaf.mode=HTML

# Character encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

